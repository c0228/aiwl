<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IWLAB Server</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/commons.css', _external=True) }}">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body class="fs14">
    {% include "components/header.html" %}
    <div class="container-fluid" style="padding-top:10px;padding-left:25px;padding-right:25px;">
        <div class="row mt-1">
            <div class="col-md-12"><h4>Create a Profile</h4><hr/></div>
        </div>
        <div class="row">
            <div class="col-md-4">
                <!-- -->
                <div id="createProfiles_form_alert" class="mb-3 mt-3"></div>
                
                <div class="mb-3 mt-3">
                    <div for="createProfiles_name" class="form-label"><b>Name:</b>
                        <span class="font-red fs12 mt3p float-end"><i>[Required Field]</i></span> 
                    </div>
                    <input type="text" class="form-control" id="createProfile_name" placeholder="Enter your Name">
                </div>
                <!-- -->
            </div>
            <div class="col-md-4">
                <div class="mb-3 mt-3">
                    <div for="createProfiles_name" class="form-label"><b>Country:</b>
                        <span class="font-red fs12 mt3p float-end"><i>[Required Field]</i></span> 
                    </div>
                    <input type="text" class="form-control" id="createProfile_country" placeholder="Enter your Name">
                </div>
            </div>
            <div class="col-md-4">

            </div>
        </div><!--/.row -->
        <div class="row mt-3">
            <div class="col-md-12">
                <!-- -->
                <div class="card">
                    <div class="card-body">
                        <h5>Educational Details</h5><hr/>
                    </div>
                </div>
                <!-- -->
            </div>
        </div><!--/.row -->
        <div class="row mt-3">
            <div class="col-md-12">
                <!-- -->
                <div class="card">
                    <div class="card-body">
                        <h5>Employeer's Details</h5><hr/>
                    </div>
                </div>
                <!-- -->
            </div>
        </div><!--/.row -->
        <div class="row mt-3">
            <div class="col-md-12">
                <!-- -->
                <div class="card">
                    <div class="card-body">
                        <h5>Visa Details</h5><hr/>
                    </div>
                </div>
                <!-- -->
            </div>
        </div><!--/.row -->
        <div class="row mt-3">
            <div class="col-md-12">
                <!-- -->
                <div class="card">
                    <div class="card-body">
                        <h5>Tech Stack Details</h5><hr/>
                    </div>
                </div>
                <!-- -->
            </div>
        </div><!--/.row -->
        <div class="row mt-3">
            <div class="col-md-12">
                <button type="button" class="btn btn-primary fs14 float-end ms-2" onclick="javascript:createProfile()"><b>Create Profile</b></button>
                <button type="button" class="btn btn-success fs14 float-end ms-2" onclick="javascript:saveProfile()"><b>Save Details</b></button>
                <button type="button" class="btn btn-danger fs14 float-end ms-2" onclick="javascript:resetProfile()"><b>Reset</b></button>
            </div><!--/.col-md-12 -->
        </div><!--/.row -->
    </div>
</body>
</html>
