<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IWLAB Server</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/commons.css', _external=True) }}">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
</head>
<body class="fs14">
    {% include "components/header.html" %}
    <div class="container-fluid">
        <div class="row mt-5">
            <div class="col-md-1"></div>
            <div class="col-md-5">
                <h4>Create a Profile</h4><hr/>
                <div id="createProfiles_form_alert" class="mb-3 mt-3"></div>
			
                <div class="mb-3 mt-3">
                    <div for="createProfiles_name" class="form-label"><b>Name:</b> <span class="font-red fs12 mt3p float-end"><i>Required</i></span></div>
                    <input type="text" class="form-control" id="register_name" placeholder="Enter your Name">
                </div>

                <button type="submit" class="btn btn-primary fs14 float-end" onclick="javascript:createAnAccount()"><b>Create a Profile</b></button>
            </div>
            <div class="col-md-5">
                <h4>Profile List</h4><hr/>
            </div>
            <div class="col-md-1"></div>
        </div>
    </div>
</body>
</html>
